apiVersion: v1
kind: ServiceAccount
metadata:
  name: todo-platform-reader
  namespace: todo-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: todo-platform-read-role
  namespace: todo-platform
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: todo-platform-read-binding
  namespace: todo-platform
subjects:
  - kind: ServiceAccount
    name: todo-platform-reader
    namespace: todo-platform
roleRef:
  kind: Role
  name: todo-platform-read-role
  apiGroup: rbac.authorization.k8s.io
