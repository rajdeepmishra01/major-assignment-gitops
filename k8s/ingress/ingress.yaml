apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-platform-ingress
  namespace: todo-platform
spec:
  rules:
    - host: todo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
