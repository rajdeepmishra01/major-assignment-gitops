apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: todo-platform-staging
  namespace: flux-system
spec:
  interval: 1m
  targetNamespace: todo-platform-staging
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./helm-charts/todo-platform
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    namespace: todo-platform-staging
    replicas:
      frontend: 2
      authService: 2
      todoService: 2
    ingress:
      host: staging.todo.local
    resources:
      frontend:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      authService:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      todoService:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
