apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: todo-platform
  namespace: flux-system
spec:
  interval: 1m
  releaseName: todo-platform
  targetNamespace: todo-platform

  chart:
    spec:
      chart: ./helm-charts/todo-platform
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m

  install:
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    replicas:
      frontend: 2
      authService: 2
      todoService: 2
