apiVersion: batch/v1
kind: Job
metadata:
  name: todo-parallel-job
  namespace: todo-platform
spec:
  completions: 6
  parallelism: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Job started by pod: $HOSTNAME"
              sleep 10
              echo "Job completed by pod: $HOSTNAME"
