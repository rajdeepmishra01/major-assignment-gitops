apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: todo-platform-network-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 5001
        - protocol: TCP
          port: 5002

    - from:
        - podSelector:
            matchLabels:
              app: auth-service
        - podSelector:
            matchLabels:
              app: todo-service
      ports:
        - protocol: TCP
          port: 5432