apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas.todoService }}
  selector:
    matchLabels:
      app: todo-service
  template:
    metadata:
      labels:
        app: todo-service
    spec:
      containers:
        - name: todo-service
          image: {{ .Values.images.todoService }}
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
          resources:
{{- toYaml .Values.resources.todoService | nindent 12 }}
          env:
            - name: PORT
              value: "5002"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: todo-service
  namespace: {{ .Values.namespace }}
  labels:
    app: auth-service
spec:
  selector:
    app: todo-service
  ports:
    - name: http
      port: 5002
      targetPort: 5002
