apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-platform-ingress
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 5001

          - path: /api/todos
            pathType: Prefix
            backend:
              service:
                name: todo-service
                port:
                  number: 5002

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
